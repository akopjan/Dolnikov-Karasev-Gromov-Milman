fidelity:
  divergences: >-
    The formalized proof differs mathematically from the paper's original proof in five fundamental ways:
    (1) Elimination of Carlsson's theorem and stable cohomotopy: The paper quotes Lemma 1 from the
    literature for general (non-abelian) 2-groups, requiring Gunnar Carlsson's theorem (Segal conjecture)
    and equivariant stable cohomotopy. In this formalization, Lemma 1 is proven from scratch, but only
    for elementary abelian 2-groups (Z/2)^r, using explicit chain complexes, barycentric subdivision,
    simplicial approximation, and the integral domain property of F_2[U_1, ..., U_r].
    (2) Level-by-level wreath induction: The paper applies Lemma 1 once to the full signed permutation
    group (Z/2)^X \rtimes H. The formalization decomposes H into an iterated wreath product K_1 \wr ... \wr K_\delta
    of elementary abelian 2-groups and applies Lemma 1 level-by-level (achievable_step). Invariance established
    at earlier levels is preserved because the join embedding is block-structured.
    (3) Concrete join spaces instead of Stiefel manifolds: The paper uses high connectivity of Stiefel
    manifolds V_m(R^n). The formalization uses the N-fold join G * ... * G with an explicit isometric
    embedding into orthogonal blocks, avoiding Stiefel homotopy groups.
    (4) Averaging lemma on separate degrees: The paper scales polynomials with mixed degrees by powers of Q
    to a single degree. The formalization treats each homogeneous degree separately and composes the resulting
    families of similarities, avoiding scale-factor discrepancies in convex weights.
    (5) Target discretization: The polynomial space is represented by values on a finite grid rather than
    an abstract infinite-dimensional vector space.

