version: "v0.4"

project:
  name: "GromovMilman"
  description: >-
    Formalization of Theorem 1 (the Gromov–Milman conjecture on polynomials restricted to subspaces)
    from Dol'nikov–Karasev, "Dvoretzky type theorems for multivariate polynomials and sections of
    convex bodies" (arXiv:1009.0392): for any even d > 0 and any k, there exists n(d, k) such that
    every homogeneous polynomial of degree d on R^n (n >= n(d, k)) restricts on some k-dimensional
    subspace V to a scalar multiple of (x_1^2 + ... + x_n^2)^(d/2).
    The formalization provides an unconditional, constructive proof without sorry or external topological
    black boxes: Carlsson's theorem on non-abelian 2-groups is eliminated in favor of an elementary abelian
    Dold-type Borsuk–Ulam theorem ((Z/2)^r) proved from scratch on chain complexes and applied inductively
    level-by-level to iterated wreath products via block-structured join embeddings.
  authors:
    - "Arseniy Akopyan"
  responsible_maintainers:
    - "Arseniy Akopyan"
  license: "Apache-2.0"

